# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# Design:
# * Every PR gets a fast 3-config matrix; every push to main/master and manual
#   run gets the full matrix. Changes that cannot affect R CMD check (README,
#   site config, other workflows, ...) are filtered with paths-ignore.
# * LaTeX (TinyTeX) is only needed to build the PDF introductory vignette, so
#   it is installed only on the configs flagged `vignettes: true` and cached
#   between runs. The other configs run R CMD check with --ignore-vignettes
#   --no-manual (the code, tests and examples are still checked in full).
# * The full matrix also checks the minimum supported R (4.4, as in
#   DESCRIPTION: Depends R (>= 4.4.0)).
# * C++ (RcppArmadillo, RcppParallel) is compiled through ccache on Linux, so
#   unchanged sources are not recompiled on every run.
# * Superseded PR runs are cancelled.
#
# Publishability gate
# -------------------
# Every run executes `R CMD check --as-cran` and fails on ERRORs and WARNINGs.
# NOTEs are judged by .github/scripts/check-cran-notes.R: only the NOTEs that
# are justified in cran-comments.md are accepted. When the pull request title
# or one of the commits is a conventional `feat`/`fix` (or a breaking change),
# or the run is started by hand, any other NOTE also fails the run ("strict"
# mode), so that such changes cannot be merged if the package would not be
# accepted by CRAN. For other commit types (docs, ci, chore, ...) unexpected
# NOTEs are reported as annotations only.
#
# The job `CI gate` aggregates everything: make it the only required status
# check in the branch protection rules.
on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'README.md'
      - 'cran-comments.md'
      - '_pkgdown.yml'
      - 'data-raw/**'
      - 'leftovers/**'
      - 'support/**'
      - 'demo/**'
      - '.github/workflows/pkgdown.yaml'
      - '.github/workflows/test-coverage.yaml'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'README.md'
      - 'cran-comments.md'
      - '_pkgdown.yml'
      - 'data-raw/**'
      - 'leftovers/**'
      - 'support/**'
      - 'demo/**'
      - '.github/workflows/pkgdown.yaml'
      - '.github/workflows/test-coverage.yaml'
  workflow_dispatch:

name: R-CMD-check

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decide whether this run is "strict" (see above).
  commit-type:
    name: Commit type
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      strict: ${{ steps.type.outputs.strict }}
      reason: ${{ steps.type.outputs.reason }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: type
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          # untrusted text: passed through the environment, never interpolated
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          RANGE=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            RANGE="${PR_BASE}..${PR_HEAD}"
          elif [ "$EVENT_NAME" = "push" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${PUSH_BEFORE}..${PUSH_AFTER}"
          fi
          export RANGE
          .github/scripts/commit-type.sh

      - name: Summary
        shell: bash
        env:
          STRICT: ${{ steps.type.outputs.strict }}
          REASON: ${{ steps.type.outputs.reason }}
        run: |
          {
            echo "### Publishability check"
            echo "Strict (NOTEs are blocking): **${STRICT}** (${REASON})"
          } >> "$GITHUB_STEP_SUMMARY"

  matrix:
    runs-on: ubuntu-latest
    outputs:
      config: ${{ steps.set.outputs.config }}
    steps:
      - id: set
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            config='[
              {"os":"ubuntu-latest","r":"release","vignettes":true},
              {"os":"ubuntu-latest","r":"devel","http-user-agent":"release","vignettes":false},
              {"os":"windows-latest","r":"release","vignettes":false}
            ]'
          else
            config='[
              {"os":"ubuntu-latest","r":"release","vignettes":true},
              {"os":"ubuntu-latest","r":"devel","http-user-agent":"release","vignettes":false},
              {"os":"ubuntu-latest","r":"4.4","vignettes":false},
              {"os":"windows-latest","r":"release","vignettes":true},
              {"os":"windows-latest","r":"devel","http-user-agent":"release","vignettes":false},
              {"os":"macos-latest","r":"release","vignettes":false}
            ]'
          fi
          echo "config=$(echo "$config" | tr -d '\n ')" >> "$GITHUB_OUTPUT"

  R-CMD-check:
    needs: [matrix, commit-type]
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 60

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})${{ matrix.config.vignettes && ' + vignettes' || '' }}

    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.matrix.outputs.config) }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NO_COLOR: "1"
      R_CLI_NUM_COLORS: "1"

    steps:
      - uses: actions/checkout@v5

      # pandoc and Quarto are only needed to build the Rmd/qmd vignettes.
      # Setup is retried once: downloads occasionally fail transiently
      # (Quarto at the release-assets.githubusercontent.com endpoint).
      - id: pandoc
        if: matrix.config.vignettes
        uses: r-lib/actions/setup-pandoc@v2
        continue-on-error: true
        with:
          pandoc-version: '3.1.11'

      - if: matrix.config.vignettes && steps.pandoc.outcome == 'failure'
        uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: '3.1.11'

      - id: quarto
        if: matrix.config.vignettes
        uses: quarto-dev/quarto-actions/setup@v2
        continue-on-error: true
        with:
          version: '1.10.18'

      - if: matrix.config.vignettes && steps.quarto.outcome == 'failure'
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.10.18'

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # ---- ccache for the C++ code (Linux only)
      - name: Set up ccache
        if: runner.os == 'Linux'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.config.os }}-${{ matrix.config.r }}
          max-size: 500M

      - name: Compile through ccache
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p ~/.R
          {
            for v in CC CXX CXX11 CXX14 CXX17 CXX20; do
              val=$(R CMD config $v 2>/dev/null) || continue
              [ -n "$val" ] && echo "$v = ccache $val"
            done
            echo "MAKEFLAGS = -j4"
          } > ~/.R/Makevars
          cat ~/.R/Makevars
          echo "CCACHE_NOHASHDIR=true" >> "$GITHUB_ENV"

      # Explicitly bind Quarto to the R installed by setup-r on Windows.
      - name: Configure Quarto R on Windows
        if: matrix.config.vignettes && runner.os == 'Windows'
        shell: Rscript {0}
        run: |
          r_bin <- normalizePath(R.home("bin"), winslash = "/")
          cat(sprintf("QUARTO_R=%s\n", r_bin), file = Sys.getenv("GITHUB_ENV"), append = TRUE)

      # qpdf/ghostscript: --compact-vignettes=gs+qpdf and the PDF checks.
      - name: Install PDF tools (Linux)
        if: matrix.config.vignettes && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf ghostscript

      - name: Install PDF tools (Windows)
        if: matrix.config.vignettes && runner.os == 'Windows'
        shell: pwsh
        run: choco install -y ghostscript qpdf

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::tinytex
          needs: check
          cache: true

      # ---- TinyTeX, cached (key: OS + package list + month, so that the
      # ---- yearly TeX Live rollover never meets a stale installation)
      - name: TinyTeX cache key
        if: matrix.config.vignettes
        id: texkey
        shell: bash
        run: echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore TinyTeX
        if: matrix.config.vignettes
        id: texcache
        uses: actions/cache@v4
        with:
          path: |
            ~/.TinyTeX
            ~/AppData/Roaming/TinyTeX
          key: tinytex-${{ runner.os }}-${{ hashFiles('.github/tinytex-packages.txt') }}-${{ steps.texkey.outputs.month }}

      - id: tinytex
        if: matrix.config.vignettes && steps.texcache.outputs.cache-hit != 'true'
        uses: r-lib/actions/setup-tinytex@v2
        continue-on-error: true

      - if: matrix.config.vignettes && steps.texcache.outputs.cache-hit != 'true' && steps.tinytex.outcome == 'failure'
        uses: r-lib/actions/setup-tinytex@v2

      - name: Install additional LaTeX packages
        if: matrix.config.vignettes && steps.texcache.outputs.cache-hit != 'true'
        shell: Rscript {0}
        run: |
          pkgs <- trimws(readLines('.github/tinytex-packages.txt'))
          pkgs <- pkgs[nzchar(pkgs) & !startsWith(pkgs, '#')]
          tinytex::tlmgr_install(pkgs, .quiet = TRUE)

      - name: Put cached TinyTeX on PATH (Linux/macOS)
        if: matrix.config.vignettes && steps.texcache.outputs.cache-hit == 'true' && runner.os != 'Windows'
        shell: bash
        run: ls -d "$HOME"/.TinyTeX/bin/* | head -n 1 >> "$GITHUB_PATH"

      - name: Put cached TinyTeX on PATH (Windows)
        if: matrix.config.vignettes && steps.texcache.outputs.cache-hit == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = Get-ChildItem "$env:APPDATA\TinyTeX\bin" -Directory | Select-Object -First 1
          $bin.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify TeX installation
        if: matrix.config.vignettes
        shell: Rscript {0}
        run: |
          pdflatex <- Sys.which("pdflatex")
          if (!nzchar(pdflatex) || !file.exists(pdflatex)) stop("pdflatex is not available")
          cat("pdflatex: ", pdflatex, "\n", sep = "")

      # ---- R CMD check
      # Windows currently has an upstream rcmdcheck/pkgbuild library-path
      # problem when R CMD build launches Quarto: the child R process cannot
      # see the temporary library containing the package being built. The
      # regular check is therefore run without vignette rebuilding on Windows,
      # followed (where requested) by an explicit vignette build after
      # installing the package.
      - uses: r-lib/actions/check-r-package@v2
        if: runner.os != 'Windows'
        with:
          upload-snapshots: true
          build_args: ${{ matrix.config.vignettes && 'c("--no-manual", "--compact-vignettes=gs+qpdf")' || 'c("--no-manual", "--no-build-vignettes")' }}
          args: ${{ matrix.config.vignettes && 'c("--no-manual", "--as-cran")' || 'c("--no-manual", "--as-cran", "--ignore-vignettes")' }}

      # NOTEs are not fatal for check-r-package; judge them here.
      - name: CRAN readiness (NOTEs)
        if: runner.os != 'Windows'
        shell: bash
        env:
          STRICT: ${{ needs.commit-type.outputs.strict }}
        run: |
          log=$(ls check/*.Rcheck/00check.log | head -n 1)
          Rscript .github/scripts/check-cran-notes.R "$log" "$STRICT"

      - name: R CMD check without vignettes on Windows
        if: runner.os == 'Windows'
        shell: Rscript {0}
        run: |
          rcmdcheck::rcmdcheck(
            args = c("--no-manual", "--ignore-vignettes"),
            build_args = c("--no-manual", "--no-build-vignettes"),
            error_on = "error",
            check_dir = "check"
          )

      - name: Install package and build vignettes on Windows
        if: matrix.config.vignettes && runner.os == 'Windows'
        shell: Rscript {0}
        run: |
          r <- file.path(R.home("bin"), "R.exe")
          status <- system2(r, c("CMD", "INSTALL", "--no-multiarch", "--with-keep.source", "."))
          if (status != 0) stop("R CMD INSTALL failed")
          tools::buildVignettes(
            "markovchain",
            dir = ".",
            lib.loc = .libPaths(),
            quiet = FALSE
          )

  # Single status to require in the branch protection rules: it is red if the
  # commit-type step or any check job failed or was cancelled.
  ci-gate:
    name: CI gate
    if: always()
    needs: [commit-type, matrix, R-CMD-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All required jobs succeeded
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: ${RESULTS}"
          for r in ${RESULTS}; do
            if [ "$r" != "success" ]; then
              echo "::error::At least one job did not succeed (${r}): the package is not publishable as it stands."
              exit 1
            fi
          done
