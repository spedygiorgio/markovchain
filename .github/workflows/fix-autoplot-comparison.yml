name: Refine autoplot comparison

on:
  push:
    branches:
      - feature/ggplot2-autoplot

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refine comparison chunk
        run: python .github/scripts/fix_autoplot_comparison.py
      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vignettes/an_introduction_to_markovchain_package.Rmd .github
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: render plot comparison side by side"
            git push
          fi
